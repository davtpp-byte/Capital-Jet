[build]
  command = "node scripts/set-site-url.js"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/apply"
  to = "/.netlify/functions/apply"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/:section/wp-content/*"
  to = "/wp-content/:splat"
  status = 200

[[redirects]]
  from = "/:section/:sub/wp-content/*"
  to = "/wp-content/:splat"
  status = 200

[[redirects]]
  from = "/:section/wp-includes/*"
  to = "/wp-includes/:splat"
  status = 200

[[redirects]]
  from = "/:section/:sub/wp-includes/*"
  to = "/wp-includes/:splat"
  status = 200
